name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate checklist data (JSON Schema + semantic lint)
        run: pnpm checklists:validate
      - name: Prettier and ESLint
        run: pnpm lint
      - name: svelte-check
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pollramp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pollramp_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Production build
        run: pnpm build
      - name: End-to-end tests (Playwright + axe)
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: pollramp-build-${{ github.run_number }}
          path: build
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [check, e2e]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/pollramp
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pollramp:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker network create pollramp
          docker run -d --name db --network pollramp -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=pollramp postgres:17-alpine
          docker run -d --name app --network pollramp -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres:pw@db:5432/pollramp -e ORIGIN=http://localhost:3000 \
            -e POLLRAMP_ADMIN_EMAIL=ci@example.org -e POLLRAMP_ADMIN_PASSWORD=ci-admin-password pollramp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep '"ok":true'
          curl -fsS -o /dev/null http://localhost:3000/p
          docker logs app
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish edge image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-build.${{ github.run_number }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}-build.${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

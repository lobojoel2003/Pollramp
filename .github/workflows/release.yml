name: Release

# Release Pollramp: build, test, publish the Docker image to GHCR and create the GitHub release
# with notes from CHANGELOG.md. Start it either way:
#   - push a tag like v1.2.3 that matches package.json, or
#   - run this workflow from the Actions tab with the version tag; if the tag does not exist yet it
#     is created on the selected branch (attributed to whoever started the run).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release, e.g. v1.0.0 (created from the selected branch if missing)
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  verify:
    name: Verify and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only used to create the tag for manual (workflow_dispatch) releases
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pollramp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pollramp_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use the existing tag, or create it for a manual release
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $TAG"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --quiet "$TAG"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git config user.name "${{ github.actor }}"
            git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
            git tag -a "$TAG" -m "Pollramp $TAG" -m "Released from ${{ github.ref_name }} by the Release workflow."
            git push origin "refs/tags/$TAG"
            echo "Created $TAG at $(git rev-parse --short HEAD)"
          else
            echo "::error::Tag $TAG not found"
            exit 1
          fi
      - name: Check the tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm checklists:validate
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - name: Package release assets
        run: |
          version='${{ steps.version.outputs.version }}'
          mkdir -p dist
          # Server bundle: run with `pnpm install --prod && node build` (see README).
          tar -czf "dist/pollramp-$version.tar.gz" \
            --transform "s,^,pollramp-$version/," \
            build migrations scripts/migrate.js scripts/create-user.js \
            package.json pnpm-lock.yaml pnpm-workspace.yaml README.md CHANGELOG.md LICENSE .env.example
          # Checklist data (CC0): schemas, base checklist and state overlays.
          (cd checklists && zip -qr "../dist/pollramp-checklists-$version.zip" .)
          node scripts/release-notes.js "$version" > dist/RELEASE_NOTES.md
          (cd dist && sha256sum pollramp-* > SHA256SUMS.txt)
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist
          retention-days: 30

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/pollramp
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Pollramp
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            io.pollramp.build-number=${{ github.run_number }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Pollramp ${{ env.TAG }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/pollramp-*.tar.gz
            dist/pollramp-checklists-*.zip
            dist/SHA256SUMS.txt
